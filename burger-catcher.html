function bg(){
 const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#090706');g.addColorStop(.5,'#18110c');g.addColorStop(1,'#2a1c13');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 ctx.strokeStyle='rgba(217,177,121,.11)';ctx.lineWidth=1;
 for(let r=0;r<20;r++)for(let c=-1;c<11;c++){const cx=c*36+(r%2)*18,cy=250+r*14;[17,12,7].forEach(R=>{ctx.beginPath();ctx.arc(cx,cy,R,Math.PI,0);ctx.stroke()})}
 ctx.strokeStyle='rgba(217,177,121,.16)';ctx.setLineDash([4,6]);ctx.beginPath();[90,180,270].forEach(x=>{ctx.moveTo(x,60);ctx.lineTo(x,520)});ctx.stroke();ctx.setLineDash([]);
 ctx.fillStyle='rgba(217,177,121,.5)';[[30,120],[320,150],[60,230],[300,260],[180,160],[120,330],[250,380]].forEach(p=>{ctx.beginPath();ctx.moveTo(p[0],p[1]-5);ctx.quadraticCurveTo(p[0],p[1],p[0]+5,p[1]);ctx.quadraticCurveTo(p[0],p[1],p[0],p[1]+5);ctx.quadraticCurveTo(p[0],p[1],p[0]-5,p[1]);ctx.quadraticCurveTo(p[0],p[1],p[0],p[1]-5);ctx.fill()});
 ctx.fillStyle='#0b0807';ctx.fillRect(0,0,W,50);ctx.fillStyle=GOLD;ctx.fillRect(0,50,W,2);
 LANES.forEach(x=>{ctx.fillStyle='#000';ctx.strokeStyle=GOLD;ctx.lineWidth=1.2;ctx.beginPath();ctx.rect(x-24,40,48,10);ctx.fill();ctx.stroke()});
 txt('Sushi',W/2,30,'italic 600 26px Georgia,serif',GOLD);
 ctx.fillStyle='#1a120c';ctx.fillRect(0,520,W,40);ctx.fillStyle=GOLD;ctx.fillRect(0,520,W,2)}
function txt(s,x,y,f,c,a){ctx.font=f;ctx.textAlign=a||'center';ctx.fillStyle=c||GOLD;ctx.fillText(s,x,y)}
function overlay(a){ctx.fillStyle='rgba(0,0,0,'+a+')';ctx.fillRect(0,0,W,H)}
// ---------- логика ----------
function update(dt){
 px+=(tx-px)*Math.min(1,dt*14);
 if(openT>0)openT-=dt;if(hurtT>0)hurtT-=dt;
 conf.forEach(p=>{p.vy+=260*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.a+=dt*8});conf=conf.filter(p=>p.y<H+20);
 if(st==='play'){
  spawn-=dt;
  if(spawn<=0){const q=Math.random(),bad=q<.14,gold=!bad&&q<.2;
   items.push({l:Math.floor(Math.random()*4),y:62,bad,gold,t:Math.floor(Math.random()*3),v:Math.floor(Math.random()*4),r:Math.random()*6});
   spawn=Math.max(.5,1.2-score*.0012)}
  const v=110+Math.min(score*.25,170);
  for(const it of items){it.y+=v*dt;it.r+=dt*3;
   if(it.l===lane&&it.y>=MY-14&&it.y<=MY+22&&!it.done){it.done=true;openT=.18;if(it.bad){lives--;hurtT=.4}else score+=it.gold?50:10}
   else if(it.y>520&&!it.done){it.done=true;if(!it.bad&&!it.gold){lives--;hurtT=.3}}}
  items=items.filter(i=>i.y<540&&!i.done);
  if(lives<=0){st='over';saveBest()}
  else if(score>=GOAL){score=GOAL;st='final';items=[];tx=180;big={y:-90,vy:0};ft=0}}
 else if(st==='final'){ft+=dt;big.vy+=520*dt;big.y+=big.vy*dt;
  if(big.y>=330){big.y=330;st='win';saveBest();
   for(let i=0;i<90;i++)conf.push({x:Math.random()*W,y:-Math.random()*200,vx:(Math.random()-.5)*60,vy:Math.random()*80,a:0,c:['#d9b179','#ff7a59','#fff','#e63946','#7bc74d'][i%5]})}}}
function draw(){
 if(st==='menu'){ctx.fillStyle='#050403';ctx.fillRect(0,0,W,H);
  if(lgOK){const h=W*LG.naturalHeight/LG.naturalWidth;ctx.drawImage(LG,0,150-h/2,W,h)}
  const g=ctx.createLinearGradient(0,380,0,440);g.addColorStop(0,'#e7c796');g.addColorStop(1,'#a97f55');
  ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(100,380);ctx.arcTo(260,380,260,440,24);ctx.arcTo(260,440,100,440,24);ctx.arcTo(100,440,100,380,24);ctx.arcTo(100,380,260,380,24);ctx.fill();
  txt('START',W/2,419,'bold 24px Georgia,serif','#1a0f08');
  txt('Catch sushi \u00b7 reach 1000 points',W/2,490,'14px Georgia,serif',GOLD);return}
 bg();
 for(const it of items)drawItem(it);
 const sh=st==='final'||st==='win';
 drawChar(px,openT>0,sh);
 if(big){ctx.save();ctx.translate(180,big.y);ctx.shadowColor='#ffd84a';ctx.shadowBlur=24;nigiri(4,'#ff7a59');ctx.restore()}
 txt('SCORE '+score,12,78,'bold 16px Georgia,serif',GOLD,'left');
 txt('BEST '+best,W-12,78,'13px Georgia,serif','#b9966a','right');
 ctx.strokeStyle=GOLD;ctx.lineWidth=1;ctx.strokeRect(12.5,86.5,W-25,7);ctx.fillStyle=GOLD;ctx.fillRect(14,88,(W-28)*Math.min(1,score/GOAL),4);
 txt('\u2665'.repeat(Math.max(0,lives)),W-12,116,'18px serif','#e8737a','right');
 if(hurtT>0){ctx.fillStyle='rgba(231,76,60,.25)';ctx.fillRect(0,0,W,H)}
 conf.forEach(p=>{ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,6,4*Math.abs(Math.cos(p.a))+1)});
 if(st==='over'){overlay(.68);txt('GAME OVER',W/2,230,'bold 40px Georgia,serif','#e8737a');txt('Score '+score,W/2,278,'20px Georgia,serif',GOLD);txt('Tap to play again',W/2,330,'16px Georgia,serif','#fff')}
 if(st==='win'){ctx.fillStyle='rgba(0,0,0,.45)';ctx.fillRect(0,100,W,170);txt('YOU WIN',W/2,185,'bold 56px Georgia,serif',GOLD);txt('1000 points!',W/2,225,'20px Georgia,serif','#fff');txt('Tap to play again',W/2,255,'14px Georgia,serif','#b9966a')}}
let last=0;
function loop(t){const dt=Math.min(.05,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script>
</body>
</html>
